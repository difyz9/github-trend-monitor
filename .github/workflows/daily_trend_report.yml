name: Daily Trend Report

on:
  schedule:
    # 09:00 China Standard Time (UTC+8)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and analyze trends
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PYTHONPATH=src python -m github_trend_monitor.crawlers.scraper_v2
          PYTHONPATH=src python -m github_trend_monitor.analysis.analyzer

      - name: Generate Markdown report
        run: PYTHONPATH=src python -m github_trend_monitor.reports.generate_daily_markdown

      - name: Commit updated data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "chore: update daily trend report"
          git push